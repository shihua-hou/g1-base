bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom_2d
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    default_nav_to_pose_bt_xml: "$(find-pkg-share g1_base)/behavior_trees/navigate_to_pose_forward_only.xml"
    default_nav_through_poses_bt_xml: "$(find-pkg-share g1_base)/behavior_trees/navigate_through_poses_forward_only.xml"
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 8.0
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.01
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 4.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 0.30
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 24
      model_dt: 0.125
      batch_size: 550
      iteration_count: 1
      prune_distance: 2.4
      transform_tolerance: 1.0
      vx_std: 0.32
      vy_std: 0.0
      wz_std: 0.35
      vx_max: 0.8
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 1.0
      ax_max: 2.0
      ax_min: -2.0
      ay_max: 0.0
      ay_min: 0.0
      az_max: 1.0
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      diff_drive:
        plugin: "mppi::DiffDriveMotionModel"
      visualize: false
      critic_index_to_visualize: 0
      publish_optimal_trajectory: false
      publish_critics_stats: false
      reset_period: 1.0
      regenerate_noises: false
      sgf_order: 2
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      TrajectoryValidator:
        plugin: "mppi::DefaultOptimalTrajectoryValidator"
        collision_lookahead_time: 2.0
        consider_footprint: false
      critics: [
        "ConstraintCritic",
        "CostCritic",
        "GoalCritic",
        "GoalAngleCritic",
        "PathAlignCritic",
        "PathFollowCritic",
        "PathAngleCritic",
        "PreferForwardCritic",
        "VelocityDeadbandCritic"
      ]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        max_path_occupancy_ratio: 0.15
        trajectory_point_step: 4
        threshold_to_consider: 0.9
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        offset_from_furthest: 8
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      VelocityDeadbandCritic:
        enabled: true
        cost_power: 1
        cost_weight: 35.0
        deadband_velocities: [0.25, 0.0, 0.05]

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "g1_centerline_planner/CenterlinePlanner"
      allow_unknown: false
      use_final_approach_orientation: false
      min_clearance: 0.38
      target_clearance: 0.90
      length_weight: 1.0
      wall_weight: 8.0
      center_weight: 4.0
      center_clearance_cap: 2.0
      costmap_weight: 2.0
      shortcut_min_clearance: 0.45
      shortcut_cost_tolerance: 1.02
      endpoint_snap_radius: 1.20
      endpoint_min_clearance: 0.18
      fallback_min_clearance: 0.25

behavior_server:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin"]
    spin:
      plugin: "nav2_behaviors/Spin"

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    stop_on_failure: false
    loop_rate: 20

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.8, 0.0, 1.0]
    min_velocity: [0.0, 0.0, -1.0]
    max_accel: [2.0, 0.0, 1.0]
    max_decel: [-2.0, 0.0, -1.0]
    odom_topic: /odom_2d
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 1.0
      publish_frequency: 0.5
      resolution: 0.08
      robot_radius: 0.30
      transform_tolerance: 1.0
      rolling_window: false
      track_unknown_space: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.65
        cost_scaling_factor: 2.0
      always_send_full_costmap: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 8.0
      publish_frequency: 5.0
      resolution: 0.08
      width: 7
      height: 7
      rolling_window: true
      robot_radius: 0.30
      transform_tolerance: 1.0
      footprint_padding: 0.05
      plugins: ["static_layer", "voxel_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      voxel_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 4.0
        decay_model: 0
        voxel_size: 0.08
        track_unknown_space: false
        unknown_threshold: 15
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        z_resolution: 0.08
        z_voxels: 24
        publish_voxel_map: true
        transform_tolerance: 1.0
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: obstacle_cloud
        obstacle_cloud:
          data_type: PointCloud2
          topic: /nav/obstacle_cloud
          marking: true
          clearing: false
          obstacle_range: 3.0
          min_obstacle_height: 0.25
          max_obstacle_height: 1.6
          expected_update_rate: 0.0
          observation_persistence: 0.0
          voxel_min_points: 1
          filter: "voxel"
          clear_after_reading: true
          model_type: 1
          sensor_frame: "base_link"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.40
        cost_scaling_factor: 3.0
      always_send_full_costmap: true

local_costmap_client:
  ros__parameters:
    use_sim_time: false

global_costmap_client:
  ros__parameters:
    use_sim_time: false

map_server:
  ros__parameters:
    use_sim_time: false
    frame_id: map
