# Params file for local_global_planner_test.launch.py.
#
# This is a robot-free local test profile. It exposes multiple planner plugins
# so local_plan_test.py can request each planner_id through ComputePathToPose.

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["SmacPlanner2D", "ThetaStarPlanner", "CenterlinePlanner"]

    SmacPlanner2D:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.5
      allow_unknown: true
      downsample_costmap: false
      cost_travel_multiplier: 1.5
      use_final_approach_orientation: false

    ThetaStarPlanner:
      plugin: "nav2_theta_star_planner/ThetaStarPlanner"
      how_many_corners: 8
      w_euc_cost: 1.0
      w_traversal_cost: 2.0
      w_heuristic_cost: 1.0
      use_final_approach_orientation: false
      allow_unknown: true

    CenterlinePlanner:
      plugin: "g1_centerline_planner/CenterlinePlanner"
      allow_unknown: false
      use_final_approach_orientation: false
      min_clearance: 0.38
      target_clearance: 0.90
      length_weight: 1.0
      wall_weight: 8.0
      center_weight: 4.0
      center_clearance_cap: 2.0
      costmap_weight: 2.0
      shortcut_min_clearance: 0.45
      shortcut_cost_tolerance: 1.02
      endpoint_snap_radius: 0.50

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 1.0
      publish_frequency: 0.5
      resolution: 0.08
      robot_radius: 0.30
      transform_tolerance: 1.0
      rolling_window: false
      track_unknown_space: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.7
        cost_scaling_factor: 2.0
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    frame_id: map
